name: DEVORA Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DEVORA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK Path
        run: |
          ANDROID_SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$ANDROID_SDKMANAGER" ]; then
            ANDROID_SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          echo "SDKMANAGER_PATH=$ANDROID_SDKMANAGER" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          yes | ${{ env.SDKMANAGER_PATH }} --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK packages
        run: |
          ${{ env.SDKMANAGER_PATH }} "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.10

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      - name: Clean project
        run: |
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload DEVORA APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVORA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
